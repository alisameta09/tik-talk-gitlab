<tt-modal class="share-community__header">

  <div class="share-community-modal">

    <div class="share-community__container">
      <div class="radio-btns__wrapper mt16">
        <button type="button" aria-label="Переключить" class="share-community__radio-btn"></button>
        <span class="medium-text">На своей странице</span>
      </div>
      <div class="radio-btns__wrapper">
        <button type="button" aria-label="Переключить" class="share-community__radio-btn"></button>
        <span class="medium-text">В личном сообщении</span>
      </div>

      <tt-input
        class="community-input"
        type="text"
        placeholder="Выберите"
      >Подписчики
        <svg icon="search" class="search-icon" iconRight></svg>
      </tt-input>

      <div class="subscribers-wrapper mb16">
        @for (subscriber of subscribers(); track subscriber.id) {
          <a [routerLink]="['/profile', subscriber.id]">
            <img
              [src]="subscriber.avatarUrl | imgPreviewUrl: 'profile'"
              alt="Фото подписчика"
              class="subscriber-avatar-btn"
            />
          </a>
        }
      </div>
    </div>

    <tt-post-input
      class="share-community-post-input"
      [isCommentInput]="true"
      placeholder="Напишите что-нибудь"
    ></tt-post-input>

    <div class="cancel-send-btn__container">
      <button class="community-cancel-btn btn" type="button">Отмена</button>
      <button class="community-send-btn btn" type="submit"
      >Отправить
        <svg icon="send-message" class="send-icon svg16" iconRight></svg>
      </button>
    </div>

  </div>
</tt-modal>
