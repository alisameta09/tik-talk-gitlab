<tt-modal>

  <form [formGroup]="editCommunityForm" class="edit-community-form">

    <div class="edit-community__container">
      <tt-input
        class="community-input"
        type="text"
        placeholder="Выберите"
        formControlName="name"
      >Название сообщества
      </tt-input>

      <tt-select
        type="text"
        placeholder="Выберите"
        formControlName="themes"
      >Тема
        <svg icon="search" class="search-icon" iconRight></svg>
      </tt-select>

      <tt-stack-input
        placeholder="Выберите"
        formControlName="tags"
        errorMessageName="тег"
      >Теги
        <svg icon="search" class="search-icon" iconRight></svg>
      </tt-stack-input>

      <div class="tt-form-label">
        <span class="tt-form-label__text">Описание</span>
        <textarea
          [rows]="1"
          class="community-hidden-textarea medium-text"
          placeholder="Выберите"
          formControlName="description"
        ></textarea>
      </div>
    </div>

    <div class="community-btn__wrapper mt20">

      <button
        class="community-delete-btn"
      (click)="onDelete()"
      >
        <svg icon="delete" class="icon-btn"></svg>
      </button>

      <div class="cancel-save-btn__container">
        <button
          class="community-cancel-btn btn"
          type="button"
          (click)="onCancel()"
        >Отмена
        </button>
        <button
          class="community-save-btn btn"
          type="submit"
          (click)="onSave($event)"
        >Сохранить
        </button>
      </div>
    </div>

  </form>

</tt-modal>
