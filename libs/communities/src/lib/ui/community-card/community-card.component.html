@if (community) {

  <div class="community-card__wrapper">
    <div class="community-card">

      <img
        [src]="community.avatarUrl | imgUrl"
        alt="Логотип сообщества"
        class="community-card__logo"
      />

      <div class="community-card__description">
        <div class="community-card__info h6"
        >{{ community.name }}
          <span class="regular">
            {{ community.subscribersAmount }}
            {{
              community.subscribersAmount === 1 ? 'подписчик'
                : (community.subscribersAmount > 1 && community.subscribersAmount < 5 ? 'подписчика' : 'подписчиков')
            }}
          </span>
        </div>
        <div class="community-card__tags">
        @for (skill of community.tags; track skill) {
          <div class="skill-tag">{{ skill }}</div>
        }
        </div>
      </div>

      <div class="community-card-button__wrapper">
        <button class="btn community-subscribe-btn" type="button"
        >Подписаться
          <svg icon="subscribe" class="svg16 subscribe-svg"></svg>
        </button>
        <a [routerLink]="['/communities', community.id]" class="btn to-community-link">
          <svg icon="go-arrow" class="svg16"></svg>
        </a>
      </div>

    </div>
  </div>
}
