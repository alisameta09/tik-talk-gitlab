<div class="communities-header mb24">
  <h4 class="h4">Сообщества</h4>
  <button class="btn create-community-btn" type="button"
  >Создать сообщество
    <svg icon="communities" class="svg16"></svg>
  </button>
</div>

<app-communities-filters></app-communities-filters>

<div class="communities-list__wrapper">
  @for (community of communities$ | async; track community.id) {
    <app-community-card
      [community]="community"
    ></app-community-card>
  }
</div>
