<form class="communities-search-form mb20" [formGroup]="searchCommunityForm">

  <tt-input
    type="text"
    placeholder="Выберите"
    formControlName="name"
    labelClass="tt-form-label tt-form-label__text"
    wrapperClass="search-by-community-name"
    inputClass="tt-form-input stack-ghost-input"
    [showSvg]="false"
  >Название сообщества
    <svg icon="search" class="search-icon" svgSearch></svg>
  </tt-input>

  <tt-select
    type="text"
    placeholder="Выберите"
    formControlName="themes"
  >Тема
  </tt-select>

  <stack-input
    placeholder="Выберите"
    formControlName="tags"
    errorMessageName="тег"
  >Теги
  </stack-input>

</form>
