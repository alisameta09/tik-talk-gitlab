<form class="communities-search-form mb20" [formGroup]="searchCommunityForm">

  <tt-input
    class="community-input"
    type="text"
    placeholder="Выберите"
    formControlName="name"
  >Название сообщества
    <svg icon="search" class="search-icon" iconRight></svg>
  </tt-input>

  <tt-select
    type="text"
    placeholder="Выберите"
    formControlName="themes"
  >Тема
  </tt-select>

  <tt-stack-input
    placeholder="Выберите"
    formControlName="tags"
    errorMessageName="тег"
  >Теги
  </tt-stack-input>

</form>
