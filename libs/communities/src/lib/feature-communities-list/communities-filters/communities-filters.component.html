<form class="communities-search-form mb20" [formGroup]="searchCommunityForm">

  <tt-form-input
    type="text"
    placeholder="Выберите"
    formControlName="communityName"
  ></tt-form-input>

    <theme-select
      type="text"
      placeholder="Выберите"
      formControlName="theme"
    ></theme-select>

  <label class="tt-form-label">
    <span class="tt-form-label__text">Теги</span>
    <stack-input
      placeholder="Выберите"
      formControlName="tags"
    ></stack-input>
  </label>

</form>
