<form class="communities-search-form mb20" [formGroup]="searchCommunityForm">

  <tt-form-input
    type="text"
    placeholder="Выберите"
    formControlName="name"
  >Название сообщества
    <svg icon="search" class="search-icon" svgSearch></svg>
  </tt-form-input>

  <tt-select
    type="text"
    placeholder="Выберите"
    formControlName="themes"
  >Тема
  </tt-select>

  <stack-input
    placeholder="Выберите"
    formControlName="tags"
    errorMessageName="тег"
  >Теги
  </stack-input>

</form>
