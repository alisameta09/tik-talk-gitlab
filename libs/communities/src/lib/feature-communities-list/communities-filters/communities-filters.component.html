<form class="communities-search-form mb20" [formGroup]="searchCommunityForm">

  <tt-form-input
    type="text"
    placeholder="Выберите"
    formControlName="communityName"
  ></tt-form-input>

  <label class="tt-form-label theme-label">
    <span class="tt-form-label__text">Тема</span>
    <input type="text" class="tt-form-input stack-ghost-input" formControlName="theme" placeholder="Выберите"/>
  </label>

  <label class="tt-form-label">
    <span class="tt-form-label__text">Теги</span>
    <stack-input
      placeholder="Выберите"
      formControlName="tags"
    ></stack-input>
  </label>

</form>
