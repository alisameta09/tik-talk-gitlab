@if (profile$ | async; as profile) {

  <header class="profile-page__header">
    <tt-profile-header [profile]="profile"></tt-profile-header>

    @if (isMyPage()) {
      <a class="btn to-settings-btn" [routerLink]="['/settings']">
        Редактировать
        <svg icon="settings" class="to-settings-icon"></svg>
      </a>
    } @else {
      <button class="btn to-settings-btn send-message" (click)="sendMessage(profile.id)">
        Написать
        <svg icon="send-message" class="to-settings-icon"></svg>
      </button>
    }
  </header>

  <main class="profile-page__body">
    <tt-post-feed></tt-post-feed>

    <div>
      <div class="subscribers-header mb16">
        <h3 class="h6">Подписчики</h3>
        <div class="count-badge">{{ profile.subscribersAmount }}</div>
      </div>

      <div class="subscribers-wrapper mb32">
        @for (subscriber of subscribers$ | async; track subscriber.id) {
          <a [routerLink]="['/profile', subscriber.id]">
            <img
              [src]="subscriber.avatarUrl | imgUrl"
              alt="Фото подписчика"
              class="subscriber-avatar-btn"
            />
          </a>
        }
        <a [routerLink]="['/search']" class="to-subscribers-search"> </a>
      </div>

      <h3 class="h6 mb16">Навыки</h3>

      <div class="stack-wrapper mb32">
        @for (skill of profile.stack; track skill) {
          <div class="skill-tag">{{ skill }}</div>
        }
      </div>

      <h3 class="h6 mb16">О себе</h3>
      <p class="medium-small-text about-me">{{ profile.description }}</p>
    </div>
  </main>

}
