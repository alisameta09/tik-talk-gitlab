<label [ngClass]="labelClass()">
  <ng-content></ng-content>

  <div [ngClass]="wrapperClass()">
    <input
      [ngClass]="inputClass()"
      [type]="type()"
      [placeholder]="placeholder()"
      [ngModel]="value"
      (ngModelChange)="onModelChange($event)"
      (blur)="onTouched()"
      [disabled]="disabled()"
    />
    <button class="username-telegram-btn" type="button">
      @if (showSvg()) {
        <svg icon="telegram" class="svg20"></svg>
      }
    </button>

    <ng-content select="[svgSearch]"></ng-content>
  </div>
</label>
