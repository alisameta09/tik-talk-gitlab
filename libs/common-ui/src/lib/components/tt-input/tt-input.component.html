<label class="tt-label-input">
  <ng-content></ng-content>

  <div class="tt-input-wrapper">
    <input
      class="tt-input"
      [type]="type()"
      [placeholder]="placeholder()"
      [ngModel]="value"
      (ngModelChange)="onModelChange($event)"
      (blur)="onTouched()"
      [disabled]="disabled()"
    />
    <button class="username-telegram-btn" type="button">
      @if (showSvg()) {
        <svg icon="telegram" class="svg20"></svg>
      }
    </button>

    <ng-content select="[iconRight]"></ng-content>
  </div>
</label>
