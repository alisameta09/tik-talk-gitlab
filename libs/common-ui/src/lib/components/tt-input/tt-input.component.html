<label class="tt-label-input">
  <ng-content></ng-content>

  <div class="tt-input-wrapper">
    <input
      class="tt-input"
      [type]="type()"
      [placeholder]="placeholder()"
      [ngModel]="value"
      (ngModelChange)="onModelChange($event)"
      (blur)="onTouched()"
      [disabled]="disabled()"
    />
    <button class="tt-input-btn" type="button">
      <ng-content select="[iconRight]"></ng-content>
    </button>
  </div>

</label>
