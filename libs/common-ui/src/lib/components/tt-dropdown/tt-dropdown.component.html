<li
  [value]="item()"
  (click)="emitItem(item())"
  [class.selected]="selectedItems().includes(item())"
  class="item-list"
>
  <div class="item-list__wrapper">
      <span class="buttons-text item-label"
      >{{ item() }}
      </span>
    <svg icon="checkbox" class="svg16 checkbox-svg"></svg>
  </div>
</li>
