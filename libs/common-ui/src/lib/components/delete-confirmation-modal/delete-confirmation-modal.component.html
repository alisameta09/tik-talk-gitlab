<tt-modal class="delete-community-modal">

  <div class="confirm-modal__container">
    <header class="h6 delete-confirmation-question mb24">Уверены, что хотите удалить?</header>

    <div class="cancel-delete-btn__container">
      <button
        class="community-cancel-btn btn"
        type="button"
        (click)="onCancel()"
      >Нет
      </button>
      <button
        class="community-delete-btn btn"
        type="submit"
        (click)="onDelete()"
      >Да
      </button>
    </div>
  </div>

</tt-modal>
