<div class="tt-form-label">
  <span class="tt-form-label__text">{{ labelText() }}</span>

  <div class="skill-tag__container">

    @for (tech of value$ | async; track tech; let i = $index) {
      <div class="skill-tag stack-tag">
        <button
          type="button"
          class="stack-btn__delete svg16"
          (click)="onTagDelete(i)"
        >
          <svg class="svg10" icon="cross"></svg>
        </button>
        {{ tech }}
      </div>
    }

    <input
      type="text"
      class="stack-ghost-input tt-form-input"
      [(ngModel)]="innerInput"
      [placeholder]="placeholder()"
      (blur)="onTouched()"
    />
  </div>

  @if (isDuplicate()) {
    <span class="error-message medium-small-text">Такой {{ errorMessageName() }} уже добавлен!</span>
  }

</div>
