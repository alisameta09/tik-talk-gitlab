<label class="tt-form-label tt-form-label__text">

  <ng-content></ng-content>

  <div class="search-by-community-name">
    <input
      [ngModel]="value"
      (ngModelChange)="onModelChange($event)"
      [type]="type()"
      [placeholder]="placeholder()"
      class="tt-form-input stack-ghost-input"
      (blur)="onTouched()"
    />

    <svg icon="search" class="search-icon"></svg>
  </div>
</label>
