@if (isMine()) {
  <tt-post-input
    (postCreated)="onCreatePost($event)"
    [avatarUrl]="postInputAvatar()"
    placeholder="Напишите что-нибудь"
  ></tt-post-input>
}

<div class="post_wrapper" resizePage>
  @for (post of feed(); track post.id) {
    <tt-post
      [post]="post"
      [community]="community()"
    ></tt-post>
  }
</div>
