@if (profile(); as profile) {
  <tt-avatar-circle
    class="size32"
    [avatarUrl]="avatarUrl()"
  ></tt-avatar-circle>
}

<textarea
  #textarea
  [rows]="1"
  name="textarea-post"
  [(ngModel)]="postText"
  class="hidden-textarea medium-text"
  (input)="onTextAreaInput($event)"
  (keyup.enter)="onPostSend(textarea)"
  [placeholder]="placeholder()"
></textarea>

<button class="icon-btn" (click)="onPostSend(textarea)">
  <svg icon="send-message" class="svg16"></svg>
</button>
